name: Deploy SCP SMK UKK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.SSH_HOST }}
          VPS_USER: ${{ secrets.SSH_USERNAME }}
          VPS_SSH_KEY: ${{ secrets.SSH_KEY }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'

          set -e

          cd /var/www/projects/SCP_SMK_UKK

          echo "Pulling latest code..."
          git pull --ff-only origin main

          echo "Installing production dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "Building frontend..."
          npm ci
          npm run build

          echo "Running database migrations..."
          php artisan migrate --force

          echo "Clearing and rebuilding caches..."
          php artisan optimize:clear
          php artisan config:cache
          php artisan event:cache

          echo "Deployment completed successfully!"

          REMOTE