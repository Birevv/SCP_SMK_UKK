name: Deploy SCP SMK UKK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$SSH_USERNAME@$SSH_HOST" 'bash -s' <<'REMOTE'

          set -e

          cd /var/www/projects/SCP_SMK_UKK

          echo "Pulling latest code..."
          git pull --ff-only origin main

          echo "Installing production dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "Setting up Python environment and dependencies..."
          if ! command -v python3 &> /dev/null; then
              echo "Installing Python3..."
              (apt-get update && apt-get install -y python3 python3-pip python3-venv) || \
              (sudo apt-get update && sudo apt-get install -y python3-pip python3-venv) || true
          fi

          if [ ! -d "venv" ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv 2>/dev/null || \
              (apt-get update && apt-get install -y python3-venv python3-pip && python3 -m venv venv) || \
              (sudo apt-get update && sudo apt-get install -y python3-venv python3-pip && python3 -m venv venv) || true
          fi

          if [ -f "venv/bin/pip" ]; then
              echo "Installing Python requirements into virtual environment..."
              ./venv/bin/pip install --upgrade pip --quiet
              ./venv/bin/pip install -r requirements.txt --quiet
              chmod -R a+rX venv/
          else
              echo "Virtual environment fallback: installing requirements system-wide..."
              pip3 install --break-system-packages -r requirements.txt 2>/dev/null || \
              pip3 install -r requirements.txt 2>/dev/null || \
              python3 -m pip install -r requirements.txt 2>/dev/null || true
          fi

          echo "Building frontend..."
          npm ci
          npm run build

          echo "Running database migrations..."
          php artisan migrate --force

          echo "Clearing and rebuilding caches..."
          php artisan optimize:clear
          php artisan config:cache
          php artisan event:cache

          echo "Deployment completed successfully!"

          REMOTE