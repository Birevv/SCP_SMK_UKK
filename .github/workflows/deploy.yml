name: CI/CD Pipeline & Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Pint Check
  # ==========================================
  ci:
    name: Code Quality & Pint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, gd, zip
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test
        continue-on-error: true

  # ==========================================
  # STAGE 2: Deploy to Production via Native SSH
  # ==========================================
  deploy:
    name: Deploy to Production Server
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Run Deployment via Native SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $SSH_PORT \
              $SSH_USER@$SSH_HOST \
              "cd /var/www/projects/SCP_SMK_UKK && bash deploy.sh"
